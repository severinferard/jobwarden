[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobwarden"
version = "0.1.0"
description = "Watch long-running jobs live, locally or over SSH, and wake your AI agent when they need attention"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
jobwarden = "jobwarden.cli:main"

[tool.setuptools]
packages = ["jobwarden"]

[tool.ruff]
line-length = 120
