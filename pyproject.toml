[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobwarden"
version = "0.1.0"
description = "Watch long-running jobs live, locally or over SSH, and wake your AI agent when they need attention"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Séverin Férard" }]
keywords = ["ai-agents", "claude-code", "gpu", "job-monitoring", "ssh", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/severinferard/jobwarden"
Issues = "https://github.com/severinferard/jobwarden/issues"

[project.scripts]
jobwarden = "jobwarden.cli:main"

[tool.setuptools]
packages = ["jobwarden"]

[tool.ruff]
line-length = 120
